name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.0)'
        required: false
        type: string
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.0' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.0' }}"
          body: |
            ## AppVault v2.1.0 - Professional Production Edition

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Core Architectural & Runtime Hardening in v2.1.0:
            1. 📦 **POSIX UStar & GNU Long Link Engine**: Full 155-byte prefix + 100-byte name boundary split algorithm with GNU Long Link (`././@LongLink`) support for paths > 255 bytes. State machine `TarExtractor` with checksum verification and Tar Slip traversal guards.
            2. ⚡ **Hardened zlib Streaming**: Zero-data-loss deflation and inflation engines with complete zlib return code validation (`Z_OK`, `Z_STREAM_END`, `Z_BUF_ERROR`, `Z_DATA_ERROR`, `Z_STREAM_ERROR`) and deinit cleanup.
            3. 🛡️ **IPC Socket & FIFO Safety**: Strict `lstat` mode verification (`S_IFMT`) bypassing Unix domain sockets, FIFOs, and character devices that previously caused watchdog termination.
            4. 🔗 **Native Symlink Archiving**: Broken and intact symlinks are recorded via `readlink` into Tar linkname without opening file handles, and restored natively via `symlink`.
            5. 🔑 **Two-Pass Keychain Extraction**: Non-blocking `kSecUseAuthenticationUISkip` pass prevents biometric prompts/hangs; duplicate resolution via `SecItemUpdate` and entitlement recovery.
            6. 🔒 **Hardened Cryptography**: CSPRNG salt verification, 100,000 PBKDF2-SHA256 iterations, AES-256-GCM authenticated tags, and sensitive key buffer memory wiping (`memset_s`).
            7. 🌐 **Zero-RAM Wi-Fi Web Server**: Defense-in-depth path traversal prevention, 128 KB chunked streaming downloads, streaming multipart uploads, and 64 KB header limits.
            8. ☁️ **Resilient Cloud Storage**: RFC 7636 PKCE code challenge, Google Drive Resumable Upload 308 range inspection & 401 token refresh retries, and RFC 4918 WebDAV PROPFIND XML parser.
            9. 🔍 **Data Explorer & SQLite3 C-API**: Bulletproof handle & statement cleanups with `sqlite3_close_v2`, table name sanitization, type-safe column decoding, and atomic format-preserving Plist editor with type badges.
            10. 🎯 **UI & Concurrency Stability**: Unified sheet presentation, non-blocking background directory calculations, resilient batch backup queue with per-app error logging, and POSIX-verified backup rename & delete.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
