name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.4)'
        required: false
        type: string
        default: 'v2.1.4'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.4' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.4' }}"
          body: |
            ## AppVault v2.1.4 - Comprehensive Hardening Release

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Critical Fixes in v2.1.4:
            1. 📤 **Crash-Proof Share Sheet**: Fixed crash when tapping Share on backups. Replaced invalid SwiftUI `.sheet` wrapper hosting `UIActivityViewController` with direct top-most UIKit presentation (`presentShareSheet(url:)`). Automatically configures `popoverPresentationController` with safe bounds, completely eliminating assertion crashes on iOS 16 and iPad.
            2. 🔄 **Crash-Proof Self-Contained Restore Engine**: Completely overhauled `SelectiveRestoreSheet` to execute the restore lifecycle internally with inline progress, active status, and completion feedback. Completely eliminates iOS 16 UIKit aborts caused by presenting a `UIAlertController` while a sheet is dismissing.
            3. 📂 **Safe Container Restoration & CoreFoundation Daemon Fix**: Replaced destructive `removeItem(at: dest)` on system directories (`Documents`, `Library`) with `replaceDirectoryContents`, preventing `EPERM` permission errors and protecting MobileContainerManager ACLs. Terminated `cfprefsd` before restoring preferences so preferences are not overwritten from memory.
            4. 💬 **Full AppGroup Restoration (WhatsApp & Databases)**: Fixed AppGroup archiving and restoration to capture and restore ALL root files and folders (including `ChatStorage.sqlite`, `Message/`, `Media/`, `Stickers/`), ensuring full data recovery for WhatsApp and shared group apps.
            5. ⚡ **Eradicated "Calculating..." Stalling**: Fixed `directorySize` by adding `enumerator.skipDescendants()` on symlinks (`S_IFLNK`), preventing the enumerator from escaping containers or traversing circular symlinks. Added `isSized` property so 0 KB apps display immediately instead of getting stuck in calculation state.
            6. 🚀 **User App Prioritization & Persistent Disk Caching**: User apps are now prioritized to calculate first. Sized container footprints are persisted to disk via `UserDefaults`, loading all known sizes in **0 ms** on subsequent launches.
            7. 🔑 **Google OAuth URL-Encoding & Direct Token Support**: Fixed RFC 3986 form-urlencoded encoding for Google OAuth token exchanges (preventing corrupted `+` and `&` characters in authorization codes). Added direct refresh token entry and troubleshooting guidance for `Error 401 invalid_client` and `Access blocked`.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
