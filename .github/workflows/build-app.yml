name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.8)'
        required: false
        type: string
        default: 'v2.1.8'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.8' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.8' }}"
          body: |
            ## AppVault v2.1.8 - Customizable Cloud Folders & Native Rclone Integration

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Features in v2.1.8:
            1. 📁 **Customizable Google Drive Folder & Nested Subpaths**:
               - Choose any folder in Google Drive (e.g. `Backups`, `MyBackups`, or nested paths like `Backups/iPhone14`).
               - Hierarchical folder traversal: automatically checks for existing folders and creates non-existing folders on the fly.
               - Cloud backups list and direct stream uploads dynamically resolve to your designated cloud folder.
            2. 🔄 **Native Rclone Google Drive Auto-Import**:
               - Automatically detects `rclone.conf` on jailbroken/rootless iOS (`/var/mobile/.config/rclone/rclone.conf`, etc.).
               - 1-tap connection to any existing Google Drive remote with zero manual OAuth setup, client IDs, or browser redirects.
               - Built-in fallback OAuth credentials matching rclone defaults so automated background token renewals succeed seamlessly.
            3. 🌐 **Local Rclone WebDAV Bridge Daemon & Subfolders**:
               - Start/stop local `rclone serve webdav` directly within the app on `127.0.0.1:8085`.
               - Customizable bridge subfolders to scope WebDAV backups to specific directories.
            4. 📋 **In-App Rclone Config Importer**:
               - Dedicated modal sheet to paste or import `rclone.conf` from clipboard or file, instantly parsing all remotes.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
