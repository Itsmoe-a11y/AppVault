name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.2)'
        required: false
        type: string
        default: 'v2.1.2'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.2' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.2' }}"
          body: |
            ## AppVault v2.1.2 - Hardened Production Release

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Critical Fixes in v2.1.2:
            1. ⚡ **Resolved Swift Law of Exclusivity Crash (`swift_beginAccess` / `AccessSet::insert`)**: Completely eliminated runtime aborts in `StreamingArchiveEngine.GzipStreamWriter.write(data:)` by transitioning from Swift array property buffers to explicit `UnsafeMutablePointer<z_stream>` and `UnsafeMutablePointer<UInt8>` C-level memory allocations. Raw pointers bypass Swift's dynamic exclusivity checking entirely, guaranteeing zero conflicting memory access aborts.
            2. 📱 **iOS 16 Modal Presentation Fix**: Added explicit `StackNavigationViewStyle()` to `NavigationView` across `BackupDetailSheet`, `BatchBackupSheet`, `SelectiveRestoreSheet`, `DataExplorerView`, and `BackupsListView`. Prevents split-view controller assertion crashes on iOS 16.
            3. 🎯 **Crash-Proof Backup Type Picker**: Replaced composite `HStack` inside `SegmentedPickerStyle` with native `Text` tags and dedicated explanation cards. Resolves the issue where backup modes were unselectable on iOS 16.
            4. 🎛️ **Granular Component Selection**: Added toggles for **Include Keychain & Logins**, **Include Shared App Groups**, and **Include Caches & Temp Files** directly in the backup configuration sheet.
            5. 💬 **WhatsApp & App Store Container Resolution**: Added case-insensitive and normalized bundle ID matching (`net.whatsapp.WhatsApp`, `group.net.whatsapp.WhatsApp.shared`). App row and detail sheets now accurately display combined container and shared group sizes.
            6. 🛡️ **OOM / Jetsam Prevention**: Replaced unbounded single-buffer zero-padding with chunked 64 KB writes during streaming archive creation, preventing memory spikes when handling multi-gigabyte databases or video files.
            7. ⚠️ **Zero-Collision Sheet Architecture**: Self-contained execution lifecycle within `BackupDetailSheet` with inline progress, error callouts, and success confirmation, eliminating cross-tab modal alert collisions.
            8. 🚀 **Smooth Background Scanning**: Off-thread batch size calculations with atomic state publishing, preventing UI thrashing and presentation transition interruptions.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
