name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.2.0)'
        required: false
        type: string
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || 'v2.2.0' }}
          name: "AppVault ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || 'v2.2.0' }}"
          body: |
            ## AppVault v2.2.0 - Core Engine Hardening, Enhanced Cloud Sync & Persistent Backups

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Features in v2.2.0:
            1. 📁 **Persistent Accessible Storage (`/var/mobile/Documents/AppVaultBackups`)**:
               - Stores backups in `/var/mobile/Documents/AppVaultBackups` directly accessible via Filza, Files app, and external tools with automatic POSIX permissions repair.
            2. 🛡️ **Thread-Safe Google Drive Downloads & Error Guard**:
               - Thread-safe download delegate with continuation locking to prevent race conditions.
               - Strict HTTP status code validation ensuring Google Drive API error responses are never saved as corrupted backup archives.
            3. 🔑 **URL Schemes & Deep Linking**:
               - Added `apple-magnifier` query scheme for seamless TrollStore interactions.
               - Added Google OAuth redirect URL scheme support (`com.googleusercontent.apps.__APPVAULT_GOOGLE_CLIENT_PREFIX__`).
            4. ⚡ **Core Engine & Architecture Hardening**:
               - Direct dynamic linking of `libsqlite3` and `libz` in fallback toolchains.
               - Robust streaming archive and restore engine optimizations.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
