name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.3)'
        required: false
        type: string
        default: 'v2.1.3'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.3' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.3' }}"
          body: |
            ## AppVault v2.1.3 - Instant Storage Sizing & High-Performance Disk Engine

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Critical Fixes in v2.1.3:
            1. ⚡ **Instant Progressive App Sizing**: Fixed the persistent "Calculating..." state. Sizing results stream progressively to the UI every 3 apps so visible apps show their sizes immediately instead of waiting minutes for the entire device scan to finish.
            2. 📦 **Eliminated Package Sizing Bug**: Removed `options: [.skipsPackageDescendants]` which previously caused iOS to skip inside `.app` bundles, resulting in 0 KB app sizes for WhatsApp and App Store apps.
            3. 🚀 **High-Performance POSIX Sizing**: Replaced heavy `FileManager.enumerator(at: URL)` with fast `fileManager.enumerator(atPath: String)` and direct `lstat()`, cutting disk scan time by over 80% while properly bypassing symlinks to prevent infinite loops.
            4. 🧠 **Thread-Safe In-Memory Size Caching**: Added 10-minute TTL size caching (`appSizeCache`). Subsequent refreshes or tab switches load application sizes instantly with zero calculation delay.
            5. 📲 **On-Demand Sheet Sizing**: `BackupDetailSheet` now checks and calculates storage footprint immediately on appear if tapped before background scanning reaches it.
            6. 💬 **Enhanced WhatsApp & App Group Resolution**: Deepened domain matching for `net.whatsapp.*` and multi-root container discovery (`/var/mobile/Containers/Data/Application`, `System`, and `Internal`), capturing all chat databases and media containers.
            7. 🔒 **Guaranteed State Reset**: Added safe cancellation guards ensuring `isScanning` always resets to `false`, preventing UI controls from being locked in a scanning state.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
