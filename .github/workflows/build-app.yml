name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.6)'
        required: false
        type: string
        default: 'v2.1.6'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.6' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.6' }}"
          body: |
            ## AppVault v2.1.6 - High-Throughput 200+ App Sizing Engine

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Critical Fixes in v2.1.6:
            1. 🚀 **Continuous Sliding-Window Concurrency (6 Workers)**:
               - Eradicated Head-of-Line blocking in the app sizing pipeline. Giant apps (e.g. 30GB games, WhatsApp with 100k files) no longer block other apps from calculating.
               - As each worker completes an app, it immediately pulls the next app from the queue while the UI updates continuously in real-time every 0.25s.
               - Sizing 200+ apps across device CPU cores finishes in seconds without stalling.
            2. 🧹 **Autorelease Pool Isolation & Lightweight Relative Pathing**:
               - Wrapped directory traversals inside `autoreleasepool`, eliminating memory accumulation across hundreds of thousands of enumerated files.
               - Used `.producesRelativePathURLs` and cooperative 2000-item cancellation checkpoints.
            3. 💾 **Debounced Disk Cache Persistence**:
               - Debounced `UserDefaults` cache commits during active scanning, eliminating flash I/O throttling from 200 repeated synchronous disk writes.
            4. 📊 **Unambiguous UI State**:
               - Explicitly shows `• Calculating...` for all pending apps until sizing is fully verified.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
