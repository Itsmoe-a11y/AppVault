name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.0.2)'
        required: false
        type: string
        default: 'v2.0.2'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.0.2' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.0.2' }}"
          body: |
            ## AppVault v2.0.2 - WhatsApp & Container Fixes, Socket Safety, and Stability

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights in v2.0.2:
            - 🟢 **Comprehensive App Container Discovery (WhatsApp & Third-Party Apps)**: Direct MobileContainerManager metadata resolver indices `/var/mobile/Containers/Data/Application`, `/var/containers/Bundle/Application`, and `/var/mobile/Containers/Shared/AppGroup`. Fixes 0 MB / missing document size for WhatsApp, Telegram, and other App Store apps.
            - 🛡️ **IPC Socket & FIFO Safety**: Explicitly filters out Unix domain sockets, FIFOs, and character devices that previously caused streaming reads to hang or crash under watchdog.
            - ⚡ **Stream Compressor Hardening**: Replaced offset pointer chunking with exact buffer tracking, eliminated infinite finish loops, and converted all file handles to native throwing `write(contentsOf:)` and `read(upToCount:)`.
            - 🔑 **TrollStore Keychain & AppData Entitlements**: Added `keychain-access-groups` (`*`), `com.apple.private.keychain.all-access`, and `com.apple.private.security.storage.AppDataContainers`.
            - 📖 **In-App Google Cloud Setup Guide**: Built-in 2-minute walkthrough sheet with one-tap Bundle Identifier copy helper (`dev.moe.appvault`).
            1. 🔑 **Keychain Item Backup & Restore**: Extracts app-specific Keychain credentials (`kSecClassGenericPassword`, `kSecClassInternetPassword`) so you never get logged out of restored accounts.
            2. 🌐 **Local Wi-Fi Browser Transfer Server**: Embedded HTTP server (`http://<device-ip>:8080`) providing a web dashboard to upload and download backups directly from any PC/Mac browser on your Wi-Fi network.
            3. 🔒 **AES-256-GCM Encryption**: Password-protect backup archives with PBKDF2 SHA-256 key derivation.
            4. ☁️ **Expanded Cloud Backends**: Direct streaming support for **Google Drive**, **WebDAV**, **Nextcloud**, and local NAS.
            5. 🔍 **In-App Data Explorer (Plist & SQLite)**: Inspect app data containers on-device. Edit `.plist` preferences directly and query SQLite databases (`SELECT *`, view tables and rows).
            6. 📦 **Batch Multi-Select Backup**: Queue backups for multiple apps in one automated sequence.
            7. 🎯 **Selective Restore**: Granular checkboxes to choose exactly what to restore (Documents, Preferences, Databases, App Groups, or Keychain).

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
