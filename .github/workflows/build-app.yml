name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.2.0)'
        required: false
        type: string
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || 'v2.2.0' }}
          name: "AppVault ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || 'v2.2.0' }}"
          body: |
            ## AppVault v2.2.0 - Diagnostics Logger, HTTP 308 Resumable Fix & Cloud Sync Suite

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Features in v2.2.0:
            1. 📋 **In-App Real-Time Debug Logger & Diagnostics**:
               - Embedded live log console with color-coded severity levels, category filters, and 1-tap clipboard export.
            2. 🔄 **Resumable Upload No-Redirect Engine**:
               - Dedicated `NoRedirectSessionDelegate` preventing iOS 16 URLSession from treating Google Drive HTTP 308 Resume Incomplete headers as standard redirects.
            3. 🧪 **Cloud Connection & Upload Self-Test**:
               - Direct "Test Google Drive Upload" button verifying OAuth token scopes, folder resolution, and write permissions in real time.
            4. 🌐 **Multi-Mode Google Sign-In Suite**:
               - Ephemeral Safari Sheet, External Browser callback (`onOpenURL`), and WebKit-free TV/Device Code Flow.
            5. 🔐 **Zero-Disk Streaming AES-256-GCM Encryptor (`AVENC02`)**:
               - Encrypts streaming backup chunks purely in RAM on-the-fly directly to Google Drive (0 MB local disk usage).
            6. 📲 **TrollStore iOS 16 Export Coordinator & Filza**:
               - Staged APFS hardlinks with safe POSIX permissions preventing white-screen/XPC crashes when sharing backups.
            7. ⚡ **Thread Pool Concurrency Optimization**:
               - Offloaded synchronous POSIX directory sizing to a dedicated utility GCD queue, preventing Swift cooperative pool starvation during background streaming.
            8. 🏷️ **Sequential Versioned Backup Naming**:
               - Automatic sequential versioning (`_v1_`, `_v2_`, `_v3_...`) with ISO date stamps, live name preview, and version pill badges across all backup views.
            9. 🎛️ **Multi-Tier Compression Control**:
               - Selectable compression levels (Store / Fast Level 1 / Balanced Level 6 / Max Level 9) with 256 KB zlib buffer and 4x fewer syscalls.
            10. 🚀 **Dynamic RAM Headroom Upload Buffer & Double-Buffering**:
               - Parallel overlapped upload tasks (uploads chunk N over Wi-Fi while reading/compressing chunk N+1 in RAM) with live `os_proc_available_memory()` RAM headroom scaling (up to 128 MB chunks).

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
