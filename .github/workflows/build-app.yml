name: Build AppVault (.ipa & .tipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload package to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (defaults to v2.1.5)'
        required: false
        type: string
        default: 'v2.1.5'

permissions:
  contents: write

jobs:
  build_app:
    name: Build AppVault iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-tools-${{ runner.os }}-xcodegen-ldid-v1
          restore-keys: |
            brew-tools-${{ runner.os }}-

      - name: Install Build Toolchain
        run: |
          brew install xcodegen ldid

      - name: Show Xcode & SDK Info
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make Scripts Executable
        run: |
          chmod +x tools/*.sh

      - name: Compile and Package AppVault
        run: |
          ./tools/build-app.sh "$GITHUB_WORKSPACE"

      - name: Verify IPA Structure & Entitlements
        run: |
          echo "==> Verifying Packages:"
          ls -lh "$GITHUB_WORKSPACE/AppVault.ipa" "$GITHUB_WORKSPACE/AppVault.tipa"
          
          echo "==> Verifying Mach-O entitlements:"
          mkdir -p /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/AppVault.ipa" -d /tmp/verify
          ldid -e /tmp/verify/Payload/AppVault.app/AppVault
          
          if ! ldid -e /tmp/verify/Payload/AppVault.app/AppVault | grep -q "application-identifier"; then
            echo "FATAL: Entitlements missing from final binary!" >&2
            exit 1
          fi
          echo "SUCCESS: AppVault binary verified with valid entitlements."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-Packages
          path: |
            AppVault.ipa
            AppVault.tipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.1.5' }}
          name: "AppVault ${{ github.event.inputs.release_tag || 'v2.1.5' }}"
          body: |
            ## AppVault v2.1.5 - Export & Sizing Engine Overhaul

            AppVault is an unsandboxed application for **TrollStore** and **jailbroken** iOS devices (iOS 15.0 - 17.0+).

            ### Highlights & Critical Fixes in v2.1.5:
            1. 📤 **Crash-Proof Export & Share Architecture**:
               - Fixed fatal `NSInvalidArgumentException` crash triggered by `permittedArrowDirections = []` in popover presentation. Set to `.any` with centered source rect.
               - Added `BackupActivityItemSource: NSObject, UIActivityItemSource` with `LPLinkMetadata` to prevent LinkPresentation crash on iOS 16 with `.adbk` files.
               - Added **Save to Files (iCloud / Local)** via native `UIDocumentPickerViewController(forExporting:asCopy:)` alongside **Share / AirDrop**.
            2. ⚡ **High-Speed Bounded Concurrent App Sizing**:
               - Replaced slow sequential app sizing with a bounded 4-worker concurrent task group (`withTaskGroup`).
               - Upgraded `directorySize` to use `resourceValues(forKeys:)` (`getattrlistbulk`), eliminating individual `lstat()` syscall overhead per file.
               - Fixed AppGroup sizing and archiving deduplication: unique directory paths are only enumerated and archived once, eliminating WhatsApp 4x duplicates.
               - Fixed 0-byte cache poisoning: un-sized apps are no longer permanently cached with 0s.
               - Added real-time progress indicators in `BackupDetailSheet` with immediate high-priority calculation.

            ### Installation:
            - **TrollStore**: Download `AppVault.tipa` (or `AppVault.ipa`) and open in TrollStore.
          files: |
            AppVault.ipa
            AppVault.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
